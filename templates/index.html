<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мониторинг</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ============================================================
           ПАЛИТРА (голубые тона)
           ============================================================ */
        :root {
            --bg-deep: #050d1a;
            --bg-mid: #0a1628;
            --bg-light: #0d1f3a;
            --card-bg: rgba(13, 31, 58, 0.6);
            --card-border: rgba(0, 212, 255, 0.15);
            --accent-cyan: #00d4ff;
            --accent-blue: #4facfe;
            --accent-glow: rgba(0, 212, 255, 0.4);
            --text-primary: #e0f7ff;
            --text-secondary: #7ba8c9;
            --text-muted: #4a6b8a;
            --success: #00ffa3;
            --danger: #ff4d6d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ============================================================
           ГРАДИЕНТНЫЙ ФОН (gradient mesh)
           ============================================================ */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 212, 255, 0.15), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(79, 172, 254, 0.12), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(13, 31, 58, 0.9), var(--bg-deep) 80%);
            z-index: -1;
            animation: bgShift 20s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0%   { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(-2%, -2%); }
        }

        /* ============================================================
           КОНТЕЙНЕР
           ============================================================ */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           ХЕДЕР
           ============================================================ */
        .header {
            text-align: center;
            padding: 12px 0 24px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 32px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 8px 32px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2); }
            50%      { box-shadow: 0 8px 48px rgba(0, 212, 255, 0.6), inset 0 1px 0 rgba(255,255,255,0.3); }
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 500;
        }

        /* ============================================================
           СТАТ-КАРТОЧКИ (glassmorphism)
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.15s; }
        .stat-card:nth-child(3) { animation-delay: 0.2s; }
        .stat-card:nth-child(4) { animation-delay: 0.25s; }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px var(--accent-glow);
            border-color: rgba(0, 212, 255, 0.4);
        }

        .stat-card .value {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .stat-card .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           КАРТОЧКИ ГРАФИКОВ И СПИСКОВ
           ============================================================ */
        .chart-container,
        .list-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out backwards;
            animation-delay: 0.3s;
        }

        .chart-container::before,
        .list-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.5;
        }

        .chart-container h3,
        .list-container h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }

        .chart-container h3::before,
        .list-container h3::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* ============================================================
           СПИСКИ (топ страниц / кликов)
           ============================================================ */
        .list-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.08);
            font-size: 14px;
            transition: all 0.2s;
        }

        .list-item:last-child { border-bottom: none; }

        .list-item:hover {
            padding-left: 6px;
            background: rgba(0, 212, 255, 0.04);
            border-radius: 8px;
        }

        .list-item .rank {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--bg-deep);
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .list-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
            font-weight: 500;
        }

        .list-item .count {
            font-weight: 800;
            color: var(--accent-cyan);
            margin-left: 12px;
            font-size: 15px;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        /* ============================================================
           ЗАГРУЗКА
           ============================================================ */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .loading::before {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid rgba(0, 212, 255, 0.15);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           АНИМАЦИИ
           ============================================================ */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           CHART.JS КОНТЕЙНЕР
           ============================================================ */
        .chart-wrapper {
            position: relative;
            height: 220px;
            width: 100%;
        }

        /* ============================================================
           СКРОЛЛБАР
           ============================================================ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 3px;
        }

        /* ============================================================
           АДАПТИВ
           ============================================================ */
        @media (max-width: 360px) {
            .stat-card .value { font-size: 24px; }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ХЕДЕР -->
        <div class="header">
            
            <h1>Мониторинг</h1>
            <p>Статистика за последние 7 дней</p>
        </div>

        <!-- ЗАГРУЗКА -->
        <div id="loading" class="loading">Загрузка данных...</div>

        <!-- КОНТЕНТ -->
        <div id="content" style="display: none;">
            <!-- СТАТ-КАРТОЧКИ -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="total-clicks">0</div>
                    <div class="label">👆 Кликов</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="total-views">0</div>
                    <div class="label">👁 Просмотров</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="unique-users">0</div>
                    <div class="label">👤 Уникальных</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="conversion">0%</div>
                    <div class="label">📈 Конверсия</div>
                </div>
            </div>

            <!-- ГРАФИК -->
            <div class="chart-container">
                <h3>Динамика за неделю</h3>
                <div class="chart-wrapper">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>

            <!-- ТОП СТРАНИЦ -->
            <div class="list-container">
                <h3>Топ страниц</h3>
                <div id="top-pages"></div>
            </div>

            <!-- ТОП КЛИКОВ -->
            <div class="list-container">
                <h3>Топ кликов</h3>
                <div id="top-clicks"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //   ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP
        // ============================================================
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            // Устанавливаем цвет хедера Telegram под наш фон
            tg.setHeaderColor('#050d1a');
            tg.setBackgroundColor('#050d1a');
        }

        // ============================================================
        //   ЦВЕТА ДЛЯ CHART.JS
        // ============================================================
        const CHART_COLORS = {
            cyan: '#00d4ff',
            blue: '#4facfe',
            cyanGlow: 'rgba(0, 212, 255, 0.4)',
            blueGlow: 'rgba(79, 172, 254, 0.3)',
            grid: 'rgba(0, 212, 255, 0.08)',
            text: '#7ba8c9'
        };

        // ============================================================
        //   ЗАГРУЗКА СТАТИСТИКИ
        // ============================================================
        async function loadStats() {
            try {
                const [summaryRes, dailyRes] = await Promise.all([
                    fetch('/api/stats/summary'),
                    fetch('/api/stats/daily')
                ]);

                const summary = await summaryRes.json();
                const daily = await dailyRes.json();

                // Анимированное заполнение чисел
                animateNumber('total-clicks', summary.total_clicks);
                animateNumber('total-views', summary.total_views);
                animateNumber('unique-users', summary.unique_users);

                const conversion = summary.total_views > 0
                    ? ((summary.total_clicks / summary.total_views) * 100).toFixed(1) + '%'
                    : '0%';
                document.getElementById('conversion').textContent = conversion;

                // Топ страниц с рангами
                renderList('top-pages', summary.top_pages, 'page');
                renderList('top-clicks', summary.top_clicks, 'element');

                // График
                renderChart(daily);

                // Показ контента
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('loading').textContent = '⚠️ Ошибка загрузки данных';
            }
        }

        // ============================================================
        //   АНИМАЦИЯ ЧИСЕЛ
        // ============================================================
        function animateNumber(elementId, target) {
            const el = document.getElementById(elementId);
            const duration = 800;
            const start = performance.now();
            const startVal = 0;

            function update(now) {
                const progress = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
                const current = Math.floor(startVal + (target - startVal) * eased);
                el.textContent = current.toLocaleString('ru-RU');
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        // ============================================================
        //   РЕНДЕР СПИСКОВ
        // ============================================================
        function renderList(containerId, items, nameKey) {
            const container = document.getElementById(containerId);
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="list-item"><span class="name">Нет данных</span></div>';
                return;
            }

            container.innerHTML = items.map((item, index) => `
                <div class="list-item">
                    <div class="rank">${index + 1}</div>
                    <span class="name">${item[nameKey] || 'Неизвестно'}</span>
                    <span class="count">${item.count}</span>
                </div>
            `).join('');
        }

        // ============================================================
        //   ГРАФИК (Chart.js с голубыми градиентами)
        // ============================================================
        function renderChart(daily) {
            const ctx = document.getElementById('dailyChart').getContext('2d');

            const labels = daily.daily_views.map(d => {
                const date = new Date(d.date);
                return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            });
            const viewsData = daily.daily_views.map(d => d.count);
            const clicksData = daily.daily_clicks.map(d => d.count);

            // Градиент для заливки
            const gradientViews = ctx.createLinearGradient(0, 0, 0, 220);
            gradientViews.addColorStop(0, 'rgba(0, 212, 255, 0.4)');
            gradientViews.addColorStop(1, 'rgba(0, 212, 255, 0)');

            const gradientClicks = ctx.createLinearGradient(0, 0, 0, 220);
            gradientClicks.addColorStop(0, 'rgba(79, 172, 254, 0.4)');
            gradientClicks.addColorStop(1, 'rgba(79, 172, 254, 0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Просмотры',
                            data: viewsData,
                            borderColor: CHART_COLORS.cyan,
                            backgroundColor: gradientViews,
                            fill: true,
                            tension: 0.4,
                            borderWidth: 2,
                            pointBackgroundColor: CHART_COLORS.cyan,
                            pointBorderColor: '#050d1a',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            pointHoverBackgroundColor: CHART_COLORS.cyan,
                            pointHoverBorderColor: '#ffffff',
                            pointHoverBorderWidth: 2
                        },
                        {
                            label: 'Клики',
                            data: clicksData,
                            borderColor: CHART_COLORS.blue,
                            backgroundColor: gradientClicks,
                            fill: true,
                            tension: 0.4,
                            borderWidth: 2,
                            pointBackgroundColor: CHART_COLORS.blue,
                            pointBorderColor: '#050d1a',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            pointHoverBackgroundColor: CHART_COLORS.blue,
                            pointHoverBorderColor: '#ffffff',
                            pointHoverBorderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: CHART_COLORS.text,
                                padding: 16,
                                font: { size: 12, weight: '600' },
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(5, 13, 26, 0.95)',
                            borderColor: CHART_COLORS.cyan,
                            borderWidth: 1,
                            titleColor: '#ffffff',
                            bodyColor: CHART_COLORS.cyan,
                            padding: 12,
                            cornerRadius: 8,
                            displayColors: true,
                            boxPadding: 6
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: CHART_COLORS.text,
                                font: { size: 11 },
                                padding: 8
                            },
                            grid: {
                                color: CHART_COLORS.grid,
                                drawBorder: false
                            }
                        },
                        x: {
                            ticks: {
                                color: CHART_COLORS.text,
                                font: { size: 11 },
                                padding: 8
                            },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // ============================================================
        //   ЗАПУСК
        // ============================================================
        loadStats();
    </script>
</body>
</html>
